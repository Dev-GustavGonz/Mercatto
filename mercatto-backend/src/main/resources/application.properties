# ── Render Keep-Alive (Previene que el servidor gratuito se duerma tras 15 min) ─
# RENDER_EXTERNAL_URL la provee Render de forma nativa en cada Web Service.
# Tasa de ping por defecto: cada 13.5 minutos (810,000 ms)
render.keep-alive.enabled=${RENDER_KEEP_ALIVE_ENABLED:true}
render.keep-alive.url=${RENDER_EXTERNAL_URL:${APP_KEEP_ALIVE_URL:}}
render.keep-alive.rate-ms=${RENDER_KEEP_ALIVE_RATE_MS:810000}

# ── Subida de archivos ────────────────────────────────────────────

name: Deploy Mercatto Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'mercatto/mercatto-frontend/**'
      - 'mercatto-frontend/**'
      - '.github/workflows/azure-frontend.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Check Azure Frontend Token
        id: check_token
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$AZURE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Azure Static Web Apps Token Missing::No se encontró el token AZURE_STATIC_WEB_APPS_API_TOKEN en los Secrets. El despliegue en Azure Static Web Apps se omite (el frontend se sirve vía Vercel)."
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.check_token.outputs.has_token == 'true'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "mercatto-frontend"
          output_location: "dist"
          app_build_command: "npm run build"

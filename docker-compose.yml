# ================================================================
# MERCATTO MARKETPLACE — Docker Compose Completo para Producción
# Levanta Base de Datos, Backend, Frontend y Automatización n8n
# ================================================================

version: '3.8'

services:
  # 1. Base de Datos Relacional MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: mercatto-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mercatto123}
      MYSQL_DATABASE: ${DB_NAME:-mercatto_db}
      MYSQL_USER: ${DB_USER:-mercatto}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mercatto123}
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mercatto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # 2. Backend API Spring Boot (Java 21)
  backend:
    build:
      context: ./mercatto-backend
      dockerfile: Dockerfile
    container_name: mercatto-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mercatto_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD:-mercatto123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-mercatto_super_secret_key_2024_xK9mN3pQwLvR8tYuHjKzOeAbcDefGhIj}
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - mercatto-net

  # 3. Frontend Web SPA React + Vite + Nginx
  frontend:
    build:
      context: ./mercatto-frontend
      dockerfile: Dockerfile
    container_name: mercatto-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - mercatto-net

  # 4. Motor de Inteligencia Artificial y Automatización n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mercatto-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - mercatto-net

volumes:
  mysql_data:
  n8n_data:

networks:
  mercatto-net:
    driver: bridge
